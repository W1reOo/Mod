[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modharbor"
version = "0.2.0"
description = "Cross-platform local MOD manager with Nexus Mods integration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=5,<7"]

[project.scripts]
modharbor = "modmanager.__main__:main"

[tool.setuptools.package-data]
modmanager = ["web/*"]
